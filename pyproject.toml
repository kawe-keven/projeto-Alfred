[build-system]
requires = ["setuptools>=84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "alfred"
version = "0.1.0"
description = "Assistente pessoal modular e local"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlcipher3>=0.6.4",
    "PyYAML>=6.0",
    "zstandard>=0.22",
    "keyring>=25",
    "certifi>=2026.10.19",
    "filelock>=4.2.1",
]

[project.scripts]
alfred = "alfred.interfaces.cli.app:main"
alfred-armazenamento = "alfred.interfaces.cli.armazenamento:main"
alfred-painel = "alfred.interfaces.web.app:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.14"]
memoria = ["chromadb==1.5.9"]
voz = [
    "numpy>=2.1",
    "sounddevice>=0.5.6",
    "silero-vad>=6.2.3",
    "torch>=2.10",
    "onnxruntime>=1.31",
    "openwakeword>=0.6.0",
    "sherpa-onnx>=1.12.0",
    "faster-whisper>=1.2.0",
    "piper-tts>=1.8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"alfred.blueprint" = ["templates/*.md"]

[tool.pytest.ini_options]
addopts = ["-m", "not lento and not integracao and not ao_vivo"]
testpaths = ["testes"]
markers = [
    "integracao: cenários que verificam componentes conectados em fluxo integrado",
    "lento: medições sintéticas de escala e desempenho",
    "ao_vivo: verificações manuais com modelos locais reais, sempre em dados temporários",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "testes"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
